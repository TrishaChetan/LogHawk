id: LH-F01
title: Port scan blocked by firewall
description: One source hit many different blocked destination ports.
type: threshold
severity: medium
mitre: {tactic: Discovery, technique: T1046, name: Network Service Discovery}
match: {source: firewall, outcome: failure}
group_by: src_ip
distinct: dst_port
threshold: 20
window: 120
---
id: LH-F02
title: Connection attempts to remote-admin ports
description: Repeated blocked attempts against SSH, RDP, SMB, WinRM or database ports.
type: threshold
severity: low
mitre: {tactic: Lateral Movement, technique: T1021, name: Remote Services}
match: {source: firewall, outcome: failure, dst_port: [22, 3389, 445, 5985, 5986, 1433, 3306, 5432, 6379]}
group_by: src_ip
threshold: 15
window: 300
---
id: LH-F03
title: Allowed traffic on common C2 / Tor ports
description: Firewall allowed connections on ports used by Metasploit, IRC botnets and Tor relays.
type: threshold
severity: medium
mitre: {tactic: Command and Control, technique: T1571, name: Non-Standard Port}
match: {source: firewall, outcome: success, dst_port: [4444, 4445, 1337, 31337, 6666, 6667, 6668, 6669, 9001, 9030, 9050, 9150]}
group_by: [src_ip, dst_port]
threshold: 3
window: 600
